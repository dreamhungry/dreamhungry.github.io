    Selected Research Projects:
      - name: Mimosa -- Multimodal Emotion-Aware Virtual Companion System
        url: https://github.com/dreamhungry/Mimosa
        summary: "Independent Research Project | May 2026 -- Present. An end-to-end multimodal virtual companion that senses and responds to human emotion through voice and text, building a personalized and adaptive long-term relationship."
        highlights:
          - "Built a real-time voice and text interaction system with a Live2D avatar frontend, integrating VAD, ASR, LLM-based dialogue (multi-provider streaming), emotion extraction, expression mapping, and TTS into a unified bidirectional pipeline."
          - "Implemented a Big Five-based configurable personality system with trait-driven conversational style and bounded self-evolution via LLM-based reflection on interaction history."
          - "Designed an automatic memory extraction module that distills key personal facts from conversations, persists them as structured data, and reinjects them into context for cross-session continuity and personalization."
          - "Extracted emotion categories directly from LLM responses and mapped them to Live2D facial expressions, enabling the avatar to reflect emotional understanding in real time."

      - name: llm-persona-gap -- Personality Alignment Evaluation Framework for LLM Agents
        url: https://github.com/dreamhungry/llm-persona-gap
        summary: "Independent Research Project | Apr 2026 -- Present. A quantitative research framework for measuring the gap between expressed and behavioral personality in LLM-driven agents."
        highlights:
          - "Modeled personality as a continuous 4D vector (risk-taking, aggression, cooperation, deception) injected into agent prompts, supporting configurable personality presets for controlled experiments."
          - "Independently extracted behavioral personality from action trajectories and expressed personality from reasoning text via LLM-as-judge, enabling quantitative comparison between what agents do vs. what they say."
          - "Tested personality-conditioned LLM agents (GPT/DeepSeek) in Leduc Hold'em across 100+ episodes, with and without memory and communication channels."
          - "Key findings: Observed significant misalignment -- agents maintained high temporal consistency (~0.98) but showed systematic gaps in specific dimensions (e.g., deception: 0.0 behavioral despite non-zero assignment)."

    Experience:
      - company: Tencent, SGRA Studio
        position: "Tools Engineering Team Lead & Game AI Lead"
        location: China
        start_date: "2024-07"
        end_date: Present
        summary: Lead the studio's tools engineering team and serve as its Game AI lead, overseeing development tools, AI-assisted production workflows, and game AI initiatives.
        highlights:
          - "Designed and built a hybrid NPC AI architecture for Animula Nook, combining behavior trees, finite-state machines, utility AI, and LLM-based modules. Dozens of fully autonomous NPCs operate concurrently per scene, while behavioral level of detail and resource scheduling support millions of NPC entities across a persistent shared world."
          - "Led development of 10+ LLM-powered authoring tools for narrative and dialogue generation, behavior tree generation from natural language, level generation, and automated cutscene generation, substantially reducing content creation time."
          - "Built an experimental pipeline in which an LLM agent autonomously generates production tools from UI design through code implementation and automated testing, while exploring multi-agent approaches to general-purpose game generation."
          - "Contributed to core gameplay systems including character animation, NPC systems, dialogue, quests, combat, and in-game chat."
          - "Designed and built the globally distributed server architecture for Animula Nook, supporting 1M+ DAU in a single shared world."

      - company: ByteDance, Nuverse
        position: Senior Software Engineer
        location: China
        start_date: "2021-06"
        end_date: "2024-07"
        summary: Worked at Nuverse from June 2021 to December 2023 and from February to July 2024, developing game AI systems and production tools across multiple studio projects.
        highlights:
          - "Built the battle AI for Dragonheir: Silent Gods, a launched strategy RPG with millions of downloads, using behavior trees and state machines for auto-chess-style tactical combat. Explored reinforcement learning for hero lineup composition and positioning strategies."
          - "Designed complex multi-phase boss AI using hierarchical behavior trees and state machines, modeling player-adaptive attack patterns and phase transitions."
          - "Built an event-driven, blueprint-based NPC AI system for Dragonheir: Silent Gods, supporting 1,000+ concurrent NPCs per scene and extensive scripted narrative performances."
          - "Developed a utility-based ambient NPC behavior system for an internal open-world ARPG, enabling context-aware daily routines and environmental responses."
          - "Explored generative AI in game production, including concept art and UI icon generation with diffusion models, text-to-motion generation, and video-based motion capture."
          - "Developed internal blueprint, behavior tree, narrative, quest, and dialogue editors, gaining direct insight into designer workflows and human-AI co-creation needs."

      - company: NetEase Games, Dahua Studio
        position: Software Engineer
        location: China
        start_date: "2020-04"
        end_date: "2021-06"
        summary: Worked on an internal open-world MMORPG project, developing gameplay systems and companion AI.
        highlights:
          - "Developed core gameplay systems including character control, camera, and level systems."
          - "Built companion AI combining behavior trees and utility AI, enabling NPC allies to fight alongside players with context-aware combat behavior."

      - company: NetEase Games, Dahua Studio
        position: Software Engineer
        location: China
        start_date: "2017-07"
        end_date: "2019-07"
        summary: Worked on Onmyoji Arena, a launched MOBA title.
        highlights:
          - "Shipped multiple gameplay systems including hero skills, in-game activity systems, and battle pass systems."
          - "Gained working knowledge of utility-based MOBA combat AI and participated in exploratory research on reinforcement-learning-based PvP agents."

