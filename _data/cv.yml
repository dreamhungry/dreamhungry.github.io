  summary: >
    AI systems engineer with 8+ years of industry experience in game AI, interactive agent systems,
    and AI-assisted production tools across major studios (Tencent, ByteDance, NetEase).
    My work spans the full spectrum of agent intelligence -- from traditional behavior trees and utility AI
    to LLM-driven autonomous agents with personality and memory.
    Research interests center on human-centered AI agents for interactive virtual environments --
    how to build agents that are emotionally intelligent, personalized, and capable of
    sustaining believable long-term relationships with users.

