  summary: >
    Game AI and tools engineering lead with 8+ years of industry experience at Tencent, ByteDance,
    and NetEase. My work spans behavior-based NPC intelligence, LLM-driven agents, AI-assisted
    production workflows, and generative AI for games. My research sits at the intersection of AI
    for games, intelligent interactive agents, and human-AI co-creation, with a focus on agents that
    augment human game designers throughout the creation process.

