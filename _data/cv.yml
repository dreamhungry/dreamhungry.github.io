    Projects:
      - name: Mimosa — Long-term Multimodal Virtual Companion
        url: https://github.com/dreamhungry/Mimosa
        summary: A runnable personal research prototype for exploring long-term human-AI interaction with a multimodal virtual companion.
        highlights:
          - Built a web-based virtual companion with a Live2D avatar, text chat, voice input, speech recognition, text-to-speech, and real-time interaction through a FastAPI/WebSocket backend.
          - Integrated multiple LLM providers, including OpenAI-compatible APIs, DeepSeek, Gemini, and local Ollama-based models.
          - Designed a Big Five-based personality system with configurable traits, conversational style, and bounded self-evolution through LLM-based reflection.
          - Implemented persistent conversation memory to support continuity and personalization across sessions.
          - Used the prototype to explore how personality, memory, emotional expression, and multimodal interaction can support long-term relationships with virtual agents.

      - name: llm-persona-gap — Personality Alignment Evaluation for LLM Agents
        url: https://github.com/dreamhungry/llm-persona-gap
        summary: A prototype framework for investigating whether LLM agents act consistently with the personalities they express in language.
        highlights:
          - Represented agent personality with a four-dimensional trait vector covering risk, aggression, cooperation, and deception.
          - Implemented dual-channel personality extraction using LLM-as-judge analysis for expressed traits and trajectory-based analysis for behavioral traits.
          - Built evaluation support around RLCard environments, with preliminary experiments using ChatGPT- and DeepSeek-based agents across approximately 100 episodes.
          - Implemented alignment and temporal analysis metrics, including L1 distance, cosine similarity, per-dimension gap analysis, consistency, and drift.
          - Designed extensible behavioral extraction methods, including action annotation, state-aware scoring, and LLM-based behavioral judgment.

