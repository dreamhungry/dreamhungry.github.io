    Selected Research Projects:
      - name: Mimosa -- Multimodal Emotion-Aware Virtual Companion System
        url: https://github.com/dreamhungry/Mimosa
        summary: "Independent Research Project | May 2026 -- Present. An end-to-end multimodal virtual companion that senses and responds to human emotion through voice and text, building a personalized and adaptive long-term relationship."
        highlights:
          - "Built a real-time voice and text interaction system with a Live2D avatar frontend, integrating VAD, ASR, LLM-based dialogue (multi-provider streaming), emotion extraction, expression mapping, and TTS into a unified bidirectional pipeline."
          - "Implemented a Big Five-based configurable personality system with trait-driven conversational style and bounded self-evolution via LLM-based reflection on interaction history."
          - "Designed an automatic memory extraction module that distills key personal facts from conversations, persists them as structured data, and reinjects them into context for cross-session continuity and personalization."
          - "Extracted emotion categories directly from LLM responses and mapped them to Live2D facial expressions, enabling the avatar to reflect emotional understanding in real time."

      - name: llm-persona-gap -- Personality Alignment Evaluation Framework for LLM Agents
        url: https://github.com/dreamhungry/llm-persona-gap
        summary: "Independent Research Project | Apr 2026 -- Present. A quantitative research framework for measuring the gap between expressed and behavioral personality in LLM-driven agents."
        highlights:
          - "Modeled personality as a continuous 4D vector (risk-taking, aggression, cooperation, deception) injected into agent prompts, supporting configurable personality presets for controlled experiments."
          - "Independently extracted behavioral personality from action trajectories and expressed personality from reasoning text via LLM-as-judge, enabling quantitative comparison between what agents do vs. what they say."
          - "Tested personality-conditioned LLM agents (GPT/DeepSeek) in Leduc Hold'em across 100+ episodes, with and without memory and communication channels."
          - "Key findings: Observed significant misalignment -- agents maintained high temporal consistency (~0.98) but showed systematic gaps in specific dimensions (e.g., deception: 0.0 behavioral despite non-zero assignment)."

    Experience:
      - company: Tencent, SGRA Studio
        position: AI and Tools Lead
        location: China
        start_date: "2024-07"
        end_date: Present
        summary: Led a five-person AI and tools group for Animula Nook, a pre-launch interactive virtual-world simulation game, focusing on NPC intelligence, agent behavior, and AI-assisted production workflows.
        highlights:
          - "Designed and built a hybrid NPC AI architecture combining behavior trees, FSMs, utility AI, and LLM-based modules. Each NPC exhibits configurable personality traits, maintains conversation memory, performs autonomous daily routines, and engages in personalized interaction with players."
          - "Led development of 10+ LLM-powered authoring tools spanning narrative/dialogue generation, behavior tree generation from natural language, construction blueprint generation, automated cutscene generation, and more."
          - "Explored an automated pipeline where an LLM agent autonomously generates production tools end-to-end -- from UI design to code implementation to automated testing."
          - "Contributed to core gameplay systems including character animation, NPC systems, dialogue, quests, combat, and in-game chat."
          - "Previously responsible for building the global distributed server architecture supporting 1M+ DAU for shared-world multiplayer."

      - company: ByteDance, Nuverse
        position: Senior Software Engineer
        location: China
        start_date: "2021-06"
        end_date: "2024-07"
        summary: Developed game AI systems and production tools across multiple studio projects, spanning tactical combat AI, open-world ambient NPC behavior, and AI-assisted content generation.
        highlights:
          - "Built the battle AI system for Dragonheir: Silent Gods (launched strategy RPG) using behavior trees and state machines for auto-chess-style tactical combat. Explored RL for hero lineup composition."
          - "Designed complex multi-phase boss AI (comparable to Souls-like titles) using layered behavior trees and state machines."
          - "Built an event-driven blueprint-based NPC AI system supporting 1,000+ concurrent NPCs per scene for a text-heavy DnD-themed CRPG."
          - "Developed a utility-based ambient NPC behavior system for an internal open-world ARPG project."
          - "Explored generative AI in game production, including diffusion-based concept art/UI icon generation, text-to-motion generation, and video-based motion capture."
          - "Built internal authoring tools including blueprint editors, behavior tree editors, narrative editors, quest editors, and dialogue editors."

